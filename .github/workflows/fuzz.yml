name: fuzzgate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz-matrix:
    name: Parallel Fuzzing Target (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: "vulnerable_target"
            source_path: "examples/vulnerable_target/target.cpp"
            binary_path: "examples/vulnerable_target/fuzz_target"
          - target_name: "clean_target"
            source_path: "examples/clean_target/target.cpp"
            binary_path: "examples/clean_target/fuzz_target"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Hash & Corpus State (R.3 & R.5)
        uses: actions/cache@v4
        with:
          path: |
            .fuzz_cache
            examples/${{ matrix.target_name }}/corpus
          key: ${{ runner.os }}-fuzz-${{ matrix.target_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target_name }}-

      - name: Set up Clang & LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3

      - name: Compile Target (${{ matrix.target_name }})
        run: |
          clang++ -g -O0 -fsanitize=fuzzer,address \
            ${{ matrix.source_path }} \
            -o ${{ matrix.binary_path }}

      - name: Run Bounded Fuzzing Loop with Target Selection
        run: |
          python3 src/fuzz_wrapper.py \
            --target=./${{ matrix.binary_path }} \
            --timeout=60 \
            --skip-unchanged